kind = "web"
previewPath = "/"
title = "Orbyte Plug-in"
description = "The original Orbyte plug-in starter for SDC Hackathon 2026, Domain 2, preserving its Indonesian introduction and planned workflow."
version = "1.0.0"
id = "artifacts/orbyte"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24529

[services.development]
run = "pnpm --filter @workspace/orbyte run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orbyte", "run", "build" ]
serve = "static"
publicDir = "artifacts/orbyte/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24529"
BASE_PATH = "/"
# Public demo settings (not secrets): demo data, Demo button visible.
VITE_USE_MOCK = "true"
VITE_DEMO_MODE = "true"
# Google Sheet with the demo data (shared as "Anyone with the link can view"). Remove the line to use the built-in data.
VITE_SHEET_ID = "1dkh9segLmkkAti3YY4dVHjWnJU2PVeS_HFPdFVBg9vk"
