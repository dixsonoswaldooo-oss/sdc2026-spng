kind = "web"
previewPath = "/"
title = "Orbyte Plug-in"
description = "Copy of the orbyte.my home page with the e-Salary Guard feature (SDC Hackathon 2026, Domain 2). Next.js app with a server route for the SEA-LION leave classifier."
version = "1.0.0"
id = "artifacts/orbyte"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24529

[services.development]
run = "pnpm --filter @workspace/orbyte run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/orbyte", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

# Next.js runs as a server (not static files) because /ai/classify-leave calls RunPod with keys from Secrets.
[services.production.run]
args = [ "pnpm", "--filter", "@workspace/orbyte", "run", "start" ]

[services.production.run.env]
PORT = "24529"
NODE_ENV = "production"

[services.env]
PORT = "24529"
